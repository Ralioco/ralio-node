name: Release

# Publishes to npm with provenance when a version tag is pushed.
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN is stored.
# One-time setup: configure this repo + workflow as a trusted publisher for the
# `@ralioco/sdk` package at https://www.npmjs.com/package/@ralioco/sdk/access.
#
# OIDC Trusted Publishing requires npm >= 11.5.1. Node 22 ships npm 10.x, which
# cannot authenticate via OIDC (the publish PUT comes through unauthenticated
# and the registry returns a 404), so we upgrade npm before publishing.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance / Trusted Publishing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm install -g npm@latest # OIDC Trusted Publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public --provenance
