name: Bug report
description: Report a problem with the Ralio TypeScript SDK
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not include private keys, access
        tokens, or registration tickets** in this issue. For security
        vulnerabilities, see [SECURITY.md](../../SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the full stack trace if any.
      placeholder: When I call client.chat.send(...), I get ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet that triggers the issue (redact secrets).
      render: typescript
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      placeholder: "0.1.0  (npm ls @ralioco/sdk)"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "22.x  (node --version)"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: OS, networking setup (proxies), or other context.
    validations:
      required: false
